name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: All scenarios with the rules engine
        run: python -m app.cli scenarios --mode rules
  backend-postgres:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: q2d, POSTGRES_PASSWORD: q2d, POSTGRES_DB: q2d}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://q2d:q2d@localhost:5432/q2d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
      - run: npm run build
